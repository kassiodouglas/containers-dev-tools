services:
  sonarqube-dashboard:
    build: .
    container_name: sonarqube-panel
    restart: unless-stopped
    environment:
      PORT: "3100"
      HOST: "0.0.0.0"
      SONAR_URL: "${SONAR_URL:-http://host.docker.internal:9002}"
    ports:
      - "127.0.0.1:3100:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
